name: release

# Publishes datumesh-local to crates.io when a tag v<version> is pushed: the test workflow
# must pass and the tag must equal the crate's version. crates.io authentication is Trusted
# Publishing (OIDC). A version already on crates.io is skipped rather than failing the run.
# The datumesh binary (crate datumesh, its own repository) is released after this one.

on:
  push:
    tags: ["v*"]

jobs:
  test:
    uses: ./.github/workflows/test.yml

  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: tag equals the crate's version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          v="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          echo "tag $GITHUB_REF_NAME, datumesh-local $v"
          test "$tag" = "$v"

  publish:
    needs: [test, version]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.99 --profile minimal && rustup default 1.99
      # A version already on crates.io (0.1.0 is first published with a token, before Trusted
      # Publishing is configured) is skipped rather than failing the run.
      - name: versions already published
        id: published
        run: |
          v="${GITHUB_REF_NAME#v}"
          for c in datumesh-local; do
            code="$(curl -s -o /dev/null -w '%{http_code}' -A 'datumesh-local release (github.com/datumesh-com/datumesh-local)' "https://crates.io/api/v1/crates/$c/$v")"
            if [ "$code" = 200 ]; then out=true; else out=false; fi
            echo "$c $v published: $out"
            echo "${c//-/_}=$out" >> "$GITHUB_OUTPUT"
          done
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: steps.published.outputs.datumesh_local != 'true'
      - run: cargo publish --locked
        if: steps.published.outputs.datumesh_local != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
